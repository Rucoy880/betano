<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PK44.com - Apostas e Cassino</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="icon" href="https://img.icons8.com/fluency/48/crown.png" type="image/png"/>
</head>
<body>
  <div class="top-banner">
    <p>Baixe Nosso APP, Ganhe Super Prêmios! <button>Baixar Agora</button></p>
  </div>

  <header>
    <div class="logo">PK44.COM</div>
    <div class="buttons">
      <button class="entrar">ENTRAR</button>
      <button class="registro">REGISTRO</button>
    </div>
  </header>

  <div class="promo">
    <div class="promo-card">
      <h2>R$100 GRÁTIS!</h2>
      <p>CLICA E RECEBE AGORA!</p>
      <p>SAQUE PIX NA HORA!</p>
    </div>
    <div class="promo-card">
      <h2>INDICAÇÃO = R$70</h2>
      <p>FÁCIL!</p>
      <p>100X CASHBACK</p>
    </div>
    <div class="promo-card">
      <h2>LOGIN DIÁRIO</h2>
      <p>7 DIAS = R$22 GRÁTIS!</p>
    </div>
  </div>

  <div class="games-section">
    <h2>Popular</h2>
    <div class="games-grid">
      <div class="game-card">
        <img src="https://i.imgur.com/fortune-tiger.png" alt="Fortune Tiger"/>
        <p>Fortune Tiger</p>
      </div>
      <div class="game-card">
        <img src="https://i.imgur.com/fortune-rabbit.png" alt="Fortune Rabbit"/>
        <p>Fortune Rabbit</p>
      </div>
      <div class="game-card">
        <img src="https://i.imgur.com/fortune-dragon.png" alt="Fortune Dragon"/>
        <p>Fortune Dragon</p>
      </div>
      <!-- Adicione mais jogos se quiser -->
    </div>
  </div>

  <nav class="bottom-nav">
    <div>🏠 Início</div>
    <div>🎁 Promoção</div>
    <div>💰 Depósito</div>
    <div>💸 Saque</div>
    <div>👤 Perfil</div>
  </nav>

  <script src="script.js"></script>
</body>
    </html>
